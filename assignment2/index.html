
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Russet Jewellery</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Our own CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">

            <a class="navbar-brand" href="index.html">
                RUSSET
            </a>

            <div class="navbar-nav">
                <a class="nav-link active" href="index.html">Home</a>
                <a class="nav-link" href="#products">Shop</a>
                <a class="nav-link" href="product.html">Product</a>
            </div>

            <span class="navbar-text">Cart (0)</span>

        </div>
    </nav>

    <!-- Hero section -->
    <section class="hero text-center">
        <div class="container">
            <h1>Jewellery That Defines You</h1>
            <p>Discover rings, bracelets and chains.</p>
            <a href="#products" class="btn btn-dark">
                Shop Collection
            </a>
        </div>
    </section>

    <!-- Products section -->
    <section id="products" class="container my-5">

        <h2 class="text-center mb-4">Our Jewellery</h2>

        <div class="row g-4">

            <div class="col-6 col-md-4 col-lg-3">
                <div class="card h-100">
                    <img src="https://placehold.co/400x400?text=Silver+Ring"
                         class="card-img-top" alt="Silver ring">
                    <div class="card-body">
                        <h5 class="card-title">Silver Ring</h5>
                        <p class="card-text">Rs. 1,999</p>
                        <a href="product.html" class="btn btn-dark">
                            View Product
                        </a>
                    </div>
                </div>
            </div>

            <div class="col-6 col-md-4 col-lg-3">
                <div class="card h-100">
                    <img src="https://placehold.co/400x400?text=Bracelet"
                         class="card-img-top" alt="Silver bracelet">
                    <div class="card-body">
                        <h5 class="card-title">Silver Bracelet</h5>
                        <p class="card-text">Rs. 2,499</p>
                        <a href="product.html" class="btn btn-dark">
                            View Product
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">© 2026 Russet Jewellery. Student project.</p>
    </footer>

</body>
</html>
